name: Daily Slack Available Packages

on:
  workflow_dispatch:
  schedule:
    # 9AM EST
    - cron: '0 14 * * *'

jobs:
  report-available-packages:
    runs-on: ubuntu-latest
    steps:
      - name: log start
        run: echo "Workflow daily_slack_available_packages started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: setup python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: install python deps
        run: pip install --require-hashes -r hack/requirements.txt

      - name: run generate-available-packages
        run: |
          python hack/generate-available-packages.py > available_packages.json
          echo "Generated $(wc -c < available_packages.json) bytes of package data"

      - name: post to slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          SUMMARY=$(jq '{total_packages, total_versions}' available_packages.json)
          TOTAL_PACKAGES=$(jq -r '.total_packages' available_packages.json)
          TOTAL_VERSIONS=$(jq -r '.total_versions' available_packages.json)
          DATE=$(date -u +'%Y-%m-%d')

          TEXT=$(printf "Trusted Libraries Index - Available Packages (%s)\nPackages: %s | Versions: %s\n\`\`\`%s\`\`\`" "$DATE" "$TOTAL_PACKAGES" "$TOTAL_VERSIONS" "$SUMMARY")
          PAYLOAD=$(jq -n --arg text "$TEXT" '{text: $text}')

          curl -sfS -X POST \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"

      - name: log end
        if: always()
        run: echo "Workflow daily_slack_available_packages ended at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
